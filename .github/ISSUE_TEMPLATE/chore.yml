name: Chore Template
description: 설정, 의존성, 개발 환경 등 프로젝트 관리 작업
title: "[CHORE] 작업 제목"
labels:
  - chore
assignees: []
body:
  - type: textarea
    id: work-details
    attributes:
      label: ⚙️ 작업 내용
      description: 추가하거나 변경할 설정 및 작업 내용을 작성합니다.
  - type: textarea
    id: requirements
    attributes:
      label: ✅ 요구 사항
      description: 작업해야 할 목록을 체크리스트로 작성합니다.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: references
    attributes:
      label: ℹ️ 참고
      description: 관련 문서, 설정, 이슈 등 참고할 내용을 작성합니다.

name: Feat
description: 기능 추가 또는 개선
title: "[FEAT] 기능 제목"
labels:
  - feat
assignees: []
body:
  - type: textarea
    id: purpose
    attributes:
      label: 📌 목적
      description: 추가하거나 개선하려는 기능의 목적을 작성합니다.
      placeholder: ""
  - type: textarea
    id: requirements
    attributes:
      label: ✅ 요구 사항
      description: 구현해야 할 기능과 조건을 체크리스트로 작성합니다.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: references
    attributes:
      label: ℹ️ 참고
      description: 관련 문서, 디자인, 이슈 등 참고할 내용을 작성합니다.
      placeholder: ""
